# Nginx configuration for Quiz Global
# Copy this to: /etc/nginx/sites-available/quiz.global
# Then enable with: sudo ln -s /etc/nginx/sites-available/quiz.global /etc/nginx/sites-enabled/

# Upstream gunicorn server
upstream quiz_app {
    server unix:/srv/quiz.global/gunicorn.sock fail_timeout=0;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.quiz.global quiz.global;

    # Let Certbot validate domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quiz.global quiz.global;

    # Root directory (optional - for static files served directly)
    root /srv/quiz.global;

    # SSL Certificate paths (from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/quiz.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.global/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # SSL session resumption
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/quiz.global/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Client request body size
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/quiz.global_access.log;
    error_log /var/log/nginx/quiz.global_error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Static files - served with long cache expiration
    location /static/ {
        alias /srv/quiz.global/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /srv/quiz.global/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # All other requests to gunicorn
    location / {
        # Pass the request to Gunicorn
        proxy_pass http://quiz_app;

        # HTTP version
        proxy_http_version 1.1;

        # Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Host and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Redirect handling
        proxy_redirect off;

        # Don't pass server information
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to common sensitive files
    location ~ /(\.env|\.env\.local|\.git|\.gitignore|\.htaccess|web\.config)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

